name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native:
    name: Native adapter tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter test test/io_impl_test.dart test/picker_io_test.dart test/darwin_impl_test.dart test/native_picker_test.dart
      - name: Browser adapter tests
        if: runner.os == 'Linux'
        run: flutter test --platform chrome test/web_access_test.dart
